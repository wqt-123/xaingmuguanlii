# Atlas PM WebApp - Nginx 配置文件
# 部署路径: /etc/nginx/conf.d/atlas-pm.conf

server {
    listen 80;
    server_name _;

    # 网站根目录
    root /var/www/atlas-pm;
    index index.html;

    # Gzip 压缩 - 加速传输
    gzip on;
    gzip_types text/plain text/css application/javascript text/xml application/xml;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;

    # 主页面 - 单页应用
    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存 - 1年强缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 访问日志
    access_log /var/log/nginx/atlas-pm-access.log;
    error_log /var/log/nginx/atlas-pm-error.log;

    # 文件大小限制
    client_max_body_size 10m;
}
